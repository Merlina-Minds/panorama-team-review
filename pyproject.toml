[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "panorama-team-review"
version = "0.1.0"
description = "Generate owner-centric firewall rule reviews from offline Palo Alto Panorama and PAN-OS configuration backups"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
maintainers = [{ name = "Merlina Minds", email = "kontakt@merlina-minds.de" }]
keywords = ["palo-alto", "panorama", "pan-os", "firewall", "audit", "rule-review", "compliance"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: System :: Networking :: Firewalls",
]

dependencies = [
    "lxml>=5.0",
    "pydantic>=2.6",
    "PyYAML>=6.0",
    "Jinja2>=3.1",
    "XlsxWriter>=3.2",
    "click>=8.1",
]

[project.optional-dependencies]
# PDF rendering. Needs system libraries (pango, cairo, gdk-pixbuf) on Linux.
pdf = ["weasyprint>=61.0"]
# Live hit-count enrichment. NEVER imported unless explicitly enabled in config.
api = ["requests>=2.31"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML",
]

[project.scripts]
pan-review = "panorama_team_review.cli:main"

[project.urls]
Homepage = "https://github.com/Merlina-Minds/panorama-team-review"
Issues = "https://github.com/Merlina-Minds/panorama-team-review/issues"
Source = "https://github.com/Merlina-Minds/panorama-team-review"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
panorama_team_review = ["report/templates/*.html.j2", "report/templates/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "slow: marks tests as slow",
    "needs_pdf: requires the optional weasyprint dependency",
]

[tool.ruff]
# Keep in sync with max-line-length in .flake8, which editors read.
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RET"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
disallow_untyped_defs = false
ignore_missing_imports = true
